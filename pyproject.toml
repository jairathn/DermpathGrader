# Dependency declaration for DermpathGrader.
#
# This is NOT an installable package. The repository is a flat set of
# scripts and Streamlit modules that run from the checkout root, so the
# project is marked `package = false` below. Without that, `uv sync`
# tries to build and install a root package named "dermpathgrader",
# finds no such module or package directory, and fails with
#
#     error: Could not find root package `dermpathgrader`
#
# which is what broke the first Streamlit Community Cloud deploy.
#
# requirements.txt carries the same dependency set for pip users and as
# a fallback; keep the two in step.

[project]
name = "dermpathgrader"
version = "2.1.0"
description = "Dermatopathology grading: CSCC differentiation and melanocytic MPATH-Dx v2.0 classification"
requires-python = ">=3.11"

dependencies = [
    # 1.x is required, not preferred: structured outputs, adaptive
    # thinking and the streaming helper the analyzers use do not exist
    # on 0.x. The Replit-era lock pinned 0.52.2, which would have
    # installed cleanly and then failed at the first grading call.
    "anthropic>=1.6.0",
    "chromadb>=1.0.12",
    "langchain-community>=0.3.24",
    "langchain-core>=0.3.0",
    # RecursiveCharacterTextSplitter's current home. The `langchain`
    # metapackage is only a re-export and is not needed.
    "langchain-text-splitters>=0.3.0",
    "numpy>=1.26",
    "pillow>=11.2.1",
    "pypdf>=5.6.0",
    "streamlit>=1.45.1",
    # Managed hosts ship a SQLite older than the 3.35 chromadb requires
    # and it cannot be apt-installed there. sqlite_compat.py swaps this
    # in at import time; it is inert where the system SQLite is current.
    "pysqlite3-binary>=0.5.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# extract_tiles.py only, for reading .svs whole-slide images. Also needs
# the OpenSlide C library, a system package. Skip it entirely if tiles
# are exported from ImageScope or QuPath.
wsi = ["openslide-python>=1.3.1"]
# Offline test suite and linting. Neither needs an API key.
dev = ["ruff>=0.6.0"]

[tool.uv]
# The decisive line. See the comment at the top of this file.
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
